name: build
on:
  push: { branches: [main, master], tags: ['v*'] }
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { abi: arm64-v8a,   platform: android-24 }
          - { abi: armeabi-v7a, platform: android-21 }
          - { abi: x86_64,      platform: android-24 }
    steps:
      - uses: actions/checkout@v4
      - uses: nttld/setup-ndk@v1
        id: ndk
        with: { ndk-version: r26d, local-cache: true, add-to-path: false }
      - uses: actions/cache@v4
        with:
          path: build-${{ matrix.abi }}/_deps
          key: deps-${{ runner.os }}-${{ matrix.abi }}-${{ hashFiles('CMakeLists.txt') }}
      - run: |
          cmake -B build-${{ matrix.abi }} \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=${{ matrix.platform }} \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-${{ matrix.abi }} --config Release -j$(nproc)
      - run: find library -type f -name "*.so" -exec file {} \;
      - uses: actions/upload-artifact@v4
        with:
          name: libspinox-${{ matrix.abi }}
          path: library/${{ matrix.abi }}/libspinox.so
  bundle:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: staging
          pattern: libspinox-*
      - run: |
          mkdir -p library/arm64-v8a library/armeabi-v7a library/x86_64
          [ -f staging/libspinox-arm64-v8a/libspinox.so ]   && cp staging/libspinox-arm64-v8a/libspinox.so   library/arm64-v8a/
          [ -f staging/libspinox-armeabi-v7a/libspinox.so ] && cp staging/libspinox-armeabi-v7a/libspinox.so library/armeabi-v7a/
          [ -f staging/libspinox-x86_64/libspinox.so ]      && cp staging/libspinox-x86_64/libspinox.so      library/x86_64/
          cd library && zip -r ../libspinox-library.zip . && cd ..
      - uses: actions/upload-artifact@v4
        with: { name: libspinox-library, path: libspinox-library.zip }
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: libspinox-library.zip }
