name: build
on:
  push: { branches: [main, master], tags: ['v*'] }
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { abi: arm64-v8a,   platform: android-24 }
          - { abi: armeabi-v7a, platform: android-21 }
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Font Awesome header
        run: |
          mkdir -p generated
          curl -sL --max-time 30 \
            "https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@5.15.4/webfonts/fa-solid-900.ttf" \
            -o generated/fa.ttf || true
          if [ -s generated/fa.ttf ]; then
            xxd -i -n SPINOX_FA_DATA generated/fa.ttf | \
              sed 's/^unsigned char/static const unsigned char/; s/^unsigned int/static const size_t/' \
              > generated/fa_solid.h
            echo "FA ready: $(wc -c < generated/fa.ttf) bytes"
          else
            printf '#pragma once\n#include <cstddef>\nstatic const unsigned char SPINOX_FA_DATA[] = {0};\nstatic const size_t SPINOX_FA_SIZE = 0;\n' \
              > generated/fa_solid.h
            echo "FA fallback (text only)"
          fi

      - name: Cache NDK
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: /tmp/android-ndk-r26d
          key: ndk-r26d-${{ runner.os }}

      - name: Install NDK r26d
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          echo ">>> Downloading NDK r26d from Google"
          curl -sL --max-time 300 -o /tmp/ndk.zip \
            "https://dl.google.com/android/repository/android-ndk-r26d-linux.zip"
          ls -lh /tmp/ndk.zip
          unzip -q /tmp/ndk.zip -d /tmp/
          mv /tmp/android-ndk-r26d /tmp/android-ndk-r26d.tmp
          rm -rf /tmp/android-ndk-r26d.tmp
          echo ">>> NDK installed at /tmp/android-ndk-r26d"

      - name: Verify NDK
        run: |
          NDK_HOME=/tmp/android-ndk-r26d
          echo "NDK_HOME=$NDK_HOME" >> $GITHUB_ENV
          echo "=== toolchain bin ==="
          ls "$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/" | head -10
          echo "=== clang version ==="
          "$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version
          echo "=== source file check ==="
          ls src/ | head -20
          test -f src/entry.cpp || (echo "::error::src/entry.cpp missing"; exit 1)

      - uses: actions/cache@v4
        with:
          path: build-${{ matrix.abi }}/_deps
          key: deps-${{ runner.os }}-${{ matrix.abi }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: |
          cmake -B build-${{ matrix.abi }} \
            -DCMAKE_TOOLCHAIN_FILE=/tmp/android-ndk-r26d/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=${{ matrix.platform }} \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-${{ matrix.abi }} --config Release -j$(nproc)

      - name: Verify output
        run: |
          echo "=== library output ==="
          find library -type f -name "*.so" -exec file {} \;
          test -f "library/${{ matrix.abi }}/libspinox.so" || \
            (echo "::error::libspinox.so missing for ${{ matrix.abi }}"; exit 1)

      - uses: actions/upload-artifact@v4
        with:
          name: libspinox-${{ matrix.abi }}
          path: library/${{ matrix.abi }}/libspinox.so
          if-no-files-found: error

  bundle:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: staging
          pattern: libspinox-*
      - run: |
          echo "=== downloaded artifacts ==="
          find staging -type f
          mkdir -p library/arm64-v8a library/armeabi-v7a
          [ -f staging/libspinox-arm64-v8a/libspinox.so ]   && cp staging/libspinox-arm64-v8a/libspinox.so   library/arm64-v8a/   || true
          [ -f staging/libspinox-armeabi-v7a/libspinox.so ] && cp staging/libspinox-armeabi-v7a/libspinox.so library/armeabi-v7a/ || true
          if [ ! -f library/arm64-v8a/libspinox.so ] && [ ! -f library/armeabi-v7a/libspinox.so ]; then
            echo "::error::No ARM libraries produced — build jobs failed"
            exit 1
          fi
          find library -type f -exec file {} \;
          cd library && zip -r ../libspinox-library.zip . && cd ..
          ls -lh libspinox-library.zip
      - uses: actions/upload-artifact@v4
        with:
          name: libspinox-library
          path: libspinox-library.zip
          if-no-files-found: error
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: libspinox-library.zip }
