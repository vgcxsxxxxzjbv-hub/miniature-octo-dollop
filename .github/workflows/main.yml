name: build
on:
  push: { branches: [main, master], tags: ['v*'] }
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { abi: arm64-v8a,   platform: android-24, optional: false }
          - { abi: armeabi-v7a, platform: android-21, optional: false }
          - { abi: x86_64,      platform: android-24, optional: true  }
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Font Awesome header
        run: |
          mkdir -p generated
          curl -sL --max-time 30 \
            "https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@5.15.4/webfonts/fa-solid-900.ttf" \
            -o generated/fa.ttf || true
          if [ -s generated/fa.ttf ]; then
            xxd -i -n SPINOX_FA_DATA generated/fa.ttf | \
              sed 's/^unsigned char/static const unsigned char/; s/^unsigned int/static const size_t/' \
              > generated/fa_solid.h
            echo "FA ready: $(wc -c < generated/fa.ttf) bytes"
          else
            printf '#pragma once\n#include <cstddef>\nstatic const unsigned char SPINOX_FA_DATA[] = {0};\nstatic const size_t SPINOX_FA_SIZE = 0;\n' \
              > generated/fa_solid.h
            echo "FA fallback"
          fi

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install NDK r26d
        run: |
          yes | sdkmanager --install "ndk;26.3.11579264" > /dev/null 2>&1
          echo "NDK_HOME=${ANDROID_HOME}/ndk/26.3.11579264" >> $GITHUB_ENV

      - name: Verify NDK
        run: |
          echo "NDK_HOME=$NDK_HOME"
          test -f "$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" \
            || (echo "clang missing"; exit 1)
          "$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version

      - uses: actions/cache@v4
        with:
          path: build-${{ matrix.abi }}/_deps
          key: deps-${{ runner.os }}-${{ matrix.abi }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: |
          cmake -B build-${{ matrix.abi }} \
            -DCMAKE_TOOLCHAIN_FILE=$NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=${{ matrix.platform }} \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-${{ matrix.abi }} --config Release -j$(nproc)

      - name: Verify output
        run: find library -type f -name "*.so" -exec file {} \;

      - uses: actions/upload-artifact@v4
        with:
          name: libspinox-${{ matrix.abi }}
          path: library/${{ matrix.abi }}/libspinox.so
          if-no-files-found: warn

  bundle:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: staging
          pattern: libspinox-*
      - run: |
          mkdir -p library/arm64-v8a library/armeabi-v7a library/x86_64
          [ -f staging/libspinox-arm64-v8a/libspinox.so ]   && cp staging/libspinox-arm64-v8a/libspinox.so   library/arm64-v8a/   || true
          [ -f staging/libspinox-armeabi-v7a/libspinox.so ] && cp staging/libspinox-armeabi-v7a/libspinox.so library/armeabi-v7a/ || true
          [ -f staging/libspinox-x86_64/libspinox.so ]      && cp staging/libspinox-x86_64/libspinox.so      library/x86_64/      || true
          find library -type f
          cd library && zip -r ../libspinox-library.zip . && cd .. || true
      - uses: actions/upload-artifact@v4
        with: { name: libspinox-library, path: libspinox-library.zip, if-no-files-found: warn }
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: libspinox-library.zip }
